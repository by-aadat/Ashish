<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Record Data</title>

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
html{ height:100%; background:#d7b8ff; }
body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    background: linear-gradient(135deg, #d7b8ff, #d8f8d8, #fff0c4);
    background-size: 200% 200%;
    animation: gradientMove 15s ease infinite;
    padding:20px 20px 90px 20px;
    overscroll-behavior-y: none;
}
@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.container{
    width:100%;
    max-width:1100px;
    background:rgba(255,255,255,0.22);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:25px;
    padding:30px;
    box-shadow:0 15px 35px rgba(0,0,0,0.1);
    transform:translateZ(0);
}
.title{ text-align:center; font-size:2.8rem; font-weight:700; margin-bottom:25px; color:#13004a; }
.card{
    background: rgba(255, 255, 255, 0.62);
    border-radius: 24px;
    padding: 22px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 12px 30px rgba(0,0,0,0.05);
    margin-bottom: 20px;
}
.label-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.label{ font-size:20px; font-weight:700; color:#0f0433; }
.current-date{ font-size:clamp(22px, 5vw, 36px); font-weight:800; color:#13004a; }
.employee-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.text-input, .remarks-input {
    width: 100%; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 14px; padding: 12px 16px; font-size: 15px; font-weight: 600; color: #333; font-family: inherit;
}
.status-dropdown {
    width: 100%; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 14px; padding: 12px 16px; font-size: 16px; font-weight: 700; color: #333; cursor: pointer;
}
.time-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.quick-btn { background: #6a1b9a; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
.submit-btn{
    display:block; margin:25px auto 0; padding:12px 70px; font-size:26px; font-weight:700;
    border-radius:20px; border:none; background:#13004a; color:white; cursor:pointer;
}

/* Bottom Nav Bar */
.bottom-nav {
    position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border-top: 1px solid rgba(255, 255, 255, 0.5); display: flex; justify-content: center;
    gap: 8px; padding: 10px; z-index: 999; flex-wrap: wrap; box-shadow: 0 -5px 25px rgba(0,0,0,0.1);
}
.bottom-nav a {
    text-decoration: none; padding: 8px 14px; border-radius: 12px; font-weight: 700;
    font-size: 13px; color: #13004a; background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.7);
}
.bottom-nav a.active, .bottom-nav a:hover { background: #13004a; color: #fff; }
.user-badge{ text-align:center; max-width:1100px; margin:0 auto 12px; font-size:13px; font-weight:700; color:#13004a; }
.logout-btn{ margin-left:8px; background:#b71c1c; color:#fff; border:none; padding:4px 10px; border-radius:8px; font-weight:700; font-size:11px; cursor:pointer; }

@media(max-width:768px){ .employee-grid, .time-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>

<script src="auth.js"></script>

<div id="userBadge" class="user-badge"></div>

<div class="container">
    <h1 class="title">Attendance Record Data</h1>

    <div class="card">
        <div class="label-container"><div class="label">🧑‍💼 Employee Details</div></div>
        <div class="employee-grid">
            <input type="text" id="employeeId" class="text-input" placeholder="Employee ID">
            <input type="text" id="employeeName" class="text-input" placeholder="Employee Name">
        </div>
    </div>

    <div class="card">
        <div class="label-container"><div class="label">📅 Today's Date (Current Date)</div></div>
        <div id="currentDate" class="current-date">--</div>
    </div>

    <div class="card">
        <div class="label-container"><div class="label">📌 Attendance Status</div></div>
        <select id="statusDropdown" class="status-dropdown">
            <option value="" disabled selected>Select Status</option>
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
            <option value="Leave">Leave</option>
            <option value="Half-Day">Half-Day</option>
            <option value="Holiday">Holiday</option>
            <option value="Week/off">Week/off</option>
        </select>
    </div>

    <div class="time-grid">
        <div class="card">
            <div class="label-container">
                <div class="label">Company In Time</div>
                <button type="button" class="quick-btn" onclick="setNow('inTime')">Use Current Time</button>
            </div>
            <input type="text" id="inTime" class="text-input" placeholder="e.g. 09:30 AM">
        </div>
        <div class="card">
            <div class="label-container">
                <div class="label">Company Out Time</div>
                <button type="button" class="quick-btn" onclick="setNow('outTime')">Use Current Time</button>
            </div>
            <input type="text" id="outTime" class="text-input" placeholder="e.g. 06:30 PM">
        </div>
    </div>

    <div class="card">
        <div class="label-container"><div class="label">📝 Remarks</div></div>
        <textarea id="remarksInput" class="remarks-input" placeholder="Optional remarks..."></textarea>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitAttendance()">Submit</button>
    <div id="submitStatusMsg" style="text-align:center; margin-top:10px; font-weight:700;"></div>
</div>

<!-- Bottom Fixed Nav Bar -->
<div class="bottom-nav">
    <a href="index.html" class="active">📝 Entry</a>
    <a href="history.html">📊 History</a>
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="profile.html">🙍 Profile</a>
    <a href="admin.html" class="admin-only">🛡️ Admin Panel</a>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzba_45MV6qR9dJ3zSS9dH78zJ_b9AqqhjPbzmgHk9XsQrr--raUmehkkiyspnOs6pSBw/exec";
const hrmsSession = hrmsRequireAuth(false);

let todayDateFormatted = "";

function setTodayDate(){
    const today = new Date();
    const dd = String(today.getDate()).padStart(2, '0');
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const yyyy = today.getFullYear();
    todayDateFormatted = `${dd}-${mm}-${yyyy}`;
    document.getElementById('currentDate').textContent = todayDateFormatted;
}

function setNow(fieldId){
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    document.getElementById(fieldId).value = `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
}

document.addEventListener('DOMContentLoaded', function(){
    if(!hrmsSession) return;
    setTodayDate();
    const idField = document.getElementById('employeeId');
    const nameField = document.getElementById('employeeName');
    idField.value = hrmsSession.employeeId;
    nameField.value = hrmsSession.name;

    if((hrmsSession.role || "").toLowerCase() !== "admin"){
        idField.readOnly = true; nameField.readOnly = true;
    }
});

function submitAttendance(){
    const employeeId = document.getElementById('employeeId').value.trim();
    const employeeName = document.getElementById('employeeName').value.trim();
    const status = document.getElementById('statusDropdown').value;
    const inTime = document.getElementById('inTime').value.trim();
    const outTime = document.getElementById('outTime').value.trim();
    const remarks = document.getElementById('remarksInput').value.trim();
    const statusMsg = document.getElementById('submitStatusMsg');

    if(!status){ alert("Attendance Status select karo."); return; }
    if((status === "Present" || status === "Half-Day") && (!inTime || !outTime)){
        alert("In Time aur Out Time bharna zaroori hai."); return;
    }

    const payload = {
        employeeId, employeeName, date: todayDateFormatted, status,
        inTime: inTime || "", outTime: outTime || "", remarks
    };

    statusMsg.style.color = "#333";
    statusMsg.textContent = "Submitting...";

    fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
    }).then(() => {
        statusMsg.style.color = "green";
        statusMsg.textContent = `✅ Attendance recorded for ${todayDateFormatted}`;
    }).catch(err => {
        statusMsg.style.color = "red";
        statusMsg.textContent = "❌ Failed to submit!";
    });
}
</script>
</body>
</html>
