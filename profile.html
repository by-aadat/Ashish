<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Profile</title>

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
html{ height:100%; background:#d7b8ff; }
body{
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    background: linear-gradient(135deg, #d7b8ff, #d8f8d8, #fff0c4);
    background-size: 200% 200%; animation: gradientMove 15s ease infinite;
    padding:20px 20px 90px 20px;
}
@keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

.bottom-nav {
    position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border-top: 1px solid rgba(255, 255, 255, 0.5); display: flex; justify-content: center;
    gap: 8px; padding: 10px; z-index: 999; flex-wrap: wrap; box-shadow: 0 -5px 25px rgba(0,0,0,0.1);
}
.bottom-nav a { text-decoration: none; padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 13px; color: #13004a; background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.7); }
.bottom-nav a.active, .bottom-nav a:hover { background: #13004a; color: #fff; }

.user-badge{ text-align:center; max-width:1200px; margin:0 auto 14px; font-size:13px; font-weight:700; color:#13004a; }
.logout-btn{ margin-left:10px; background:#b71c1c; color:#fff; border:none; padding:5px 14px; border-radius:10px; font-weight:700; font-size:12px; cursor:pointer; }
.container{ width:100%; max-width:640px; background:rgba(255,255,255,0.22); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.3); border-radius:25px; padding:34px; box-shadow:0 15px 35px rgba(0,0,0,0.1); text-align:center; }
.avatar{ width:110px; height:110px; border-radius:50%; object-fit:cover; background:#13004a; color:#fff; display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:800; margin:0 auto 16px; border:4px solid rgba(255,255,255,0.6); }
.profile-name{ font-size:1.7rem; font-weight:800; color:#13004a; }
.profile-role{ display:inline-block; margin-top:6px; padding:4px 16px; border-radius:20px; background:#6a1b9a; color:#fff; font-size:12px; font-weight:700; }
.detail-grid{ margin-top:28px; display:grid; grid-template-columns:1fr 1fr; gap:16px; text-align:left; }
.detail-card{ background: rgba(255,255,255,0.62); border-radius:16px; padding:16px 18px; border: 1px solid rgba(255,255,255,0.4); }
.detail-card .lbl{ font-size:12px; font-weight:700; color:#5b5b73; margin-bottom:4px; }
.detail-card .val{ font-size:15px; font-weight:700; color:#13004a; }
.pw-card{ margin-top:24px; background: rgba(255,255,255,0.62); border-radius:18px; padding:22px; border: 1px solid rgba(255,255,255,0.4); text-align:left; }
.pw-card .pw-title{ font-size:16px; font-weight:800; color:#13004a; margin-bottom:14px; text-align:center; }
.pw-field{ margin-bottom:14px; }
.pw-field label{ display:block; font-size:12px; font-weight:700; color:#4a4a63; margin-bottom:6px; }
.pw-field input{ width:100%; background: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.9); border-radius: 12px; padding: 11px 14px; font-size: 14px; font-weight:600; }
.pw-btn{ width:100%; padding:12px; font-size:15px; font-weight:800; border-radius:14px; border:none; background:#13004a; color:#fff; cursor:pointer; }
</style>
</head>
<body>

<script src="auth.js"></script>

<div id="userBadge" class="user-badge"></div>

<div class="container" id="profileContainer">
    <div class="state-msg" id="stateMsg">Loading profile...</div>
</div>

<div class="container" style="max-width:640px; margin-top:15px;">
    <div class="pw-card">
        <div class="pw-title">🔒 Change Password</div>
        <div class="pw-field"><label>Current Password</label><input type="password" id="currentPassword"></div>
        <div class="pw-field"><label>New Password</label><input type="password" id="newPassword"></div>
        <div class="pw-field"><label>Confirm New Password</label><input type="password" id="confirmPassword"></div>
        <button class="pw-btn" id="changePwBtn" onclick="submitChangePassword()">Update Password</button>
        <div class="pw-msg" id="pwMsg" style="text-align:center; margin-top:10px; font-weight:700;"></div>
    </div>
</div>

<div class="bottom-nav">
    <a href="index.html">📝 Attendance Entry</a>
    <a href="history.html">📊 Attendance History</a>
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="profile.html" class="active">🙍 Profile</a>
    <a href="admin.html" class="admin-only">🛡️ Admin Panel</a>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzba_45MV6qR9dJ3zSS9dH78zJ_b9AqqhjPbzmgHk9XsQrr--raUmehkkiyspnOs6pSBw/exec";
const hrmsSession = hrmsRequireAuth(false);

function loadProfile(){
    fetch(`${APPS_SCRIPT_URL}?action=profile&employeeId=${encodeURIComponent(hrmsSession.employeeId)}`)
        .then(res => res.json())
        .then(json => { if(json.result === "success") renderProfile(json.profile); });
}

function renderProfile(p){
    const initials = (p.name || "?").trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
    document.getElementById('profileContainer').innerHTML = `
        <div class="avatar">${initials}</div>
        <div class="profile-name">${p.name || '-'}</div>
        <div class="profile-role">${p.role || 'Employee'}</div>
        <div class="detail-grid">
            <div class="detail-card"><div class="lbl">Employee ID</div><div class="val">${p.employeeId || '-'}</div></div>
            <div class="detail-card"><div class="lbl">Department</div><div class="val">${p.department || '-'}</div></div>
            <div class="detail-card"><div class="lbl">Designation</div><div class="val">${p.designation || '-'}</div></div>
            <div class="detail-card"><div class="lbl">Joining Date</div><div class="val">${p.joiningDate || '-'}</div></div>
        </div>
    `;
}

function submitChangePassword(){
    const currentPassword = document.getElementById('currentPassword').value.trim();
    const newPassword = document.getElementById('newPassword').value.trim();
    const confirmPassword = document.getElementById('confirmPassword').value.trim();
    const pwMsg = document.getElementById('pwMsg');

    if(newPassword !== confirmPassword){ pwMsg.style.color = "red"; pwMsg.textContent = "Password match nahi ho rahe."; return; }

    fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'changePassword', employeeId: hrmsSession.employeeId, currentPassword, newPassword })
    }).then(res => res.json()).then(json => {
        pwMsg.style.color = json.result === "success" ? "green" : "red";
        pwMsg.textContent = json.message || "Updated";
    });
}

if(hrmsSession) loadProfile();
</script>
</body>
</html>
