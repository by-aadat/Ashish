<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Attendance System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', 'Segoe UI', sans-serif; }

body {
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
    background-size: 200% 200%;
    animation: gradientMove 12s ease infinite;
    padding:16px;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Tight & Compact Card */
.login-card {
    width:100%;
    max-width:380px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius:20px;
    padding:32px 26px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    animation: cardAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes cardAppear {
    from { opacity:0; transform: translateY(12px) scale(0.98); }
    to { opacity:1; transform: translateY(0) scale(1); }
}

.brand-icon {
    width: 48px;
    height: 48px;
    background: #e0e7ff;
    color: #4f46e5;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin: 0 auto 12px;
}

.login-title {
    text-align:center;
    font-size:1.4rem;
    font-weight:800;
    color:#0f172a;
    letter-spacing: -0.02em;
}

.login-sub {
    text-align:center;
    font-size:12px;
    font-weight:600;
    color:#64748b;
    margin-bottom:24px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.field { margin-bottom:16px; }

.field label {
    display:block;
    font-size:12px;
    font-weight:700;
    color:#334155;
    margin-bottom:5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}

.input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.field input {
    width:100%;
    background: #f8fafc;
    border: 1.5px solid #cbd5e1;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    font-weight:600;
    color:#0f172a;
    transition: all 0.2s ease;
}

.field input:focus {
    outline:none;
    background:#ffffff;
    border-color:#4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}

.toggle-pw {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    color: #64748b;
    padding: 4px;
    user-select: none;
}

.toggle-pw:hover { color: #0f172a; }

.remember-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    font-size:13px;
}

.remember-label {
    display:flex;
    align-items:center;
    gap:7px;
    font-weight:600;
    color:#475569;
    cursor:pointer;
    user-select: none;
}

.remember-label input {
    width:15px;
    height:15px;
    accent-color: #4f46e5;
    cursor: pointer;
}

.forgot-link {
    color:#4f46e5;
    font-weight:700;
    text-decoration:none;
    transition: color 0.2s;
}

.forgot-link:hover { color:#3730a3; text-decoration:underline; }

.login-btn {
    width:100%;
    padding:12px;
    font-size:15px;
    font-weight:700;
    border-radius:10px;
    border:none;
    background:#4f46e5;
    color:#fff;
    cursor:pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
}

.login-btn:hover { background:#4338ca; transform: translateY(-1px); }
.login-btn:active { transform: translateY(0); }
.login-btn:disabled { opacity:.6; cursor:not-allowed; transform:none; box-shadow:none; }

.error-msg {
    text-align:center;
    color:#dc2626;
    font-weight:600;
    font-size:13px;
    margin-top:14px;
    min-height:18px;
    word-break: break-word;
}

/* Modal Overlay */
.modal-overlay {
    display:none;
    position:fixed; inset:0;
    background:rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(4px);
    align-items:center; justify-content:center;
    z-index:100;
    padding:16px;
}

.modal-overlay.open { display:flex; }

.modal-box {
    background:#fff;
    border-radius:16px;
    padding:24px;
    width:100%;
    max-width:360px;
    box-shadow:0 25px 50px -12px rgba(0, 0, 0, 0.35);
    animation: modalAppear 0.2s ease-out;
}

@keyframes modalAppear {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

.modal-box h3 { color:#0f172a; margin-bottom:6px; font-size: 1.15rem; font-weight: 700; }
.modal-hint { font-size:12.5px; color:#64748b; margin-bottom:16px; font-weight:500; line-height: 1.4; }
.modal-btns { display:flex; gap:10px; margin-top:12px; }
.modal-btns button { flex:1; padding:10px; border-radius:8px; border:none; font-weight:700; cursor:pointer; font-size: 14px; }
.modal-btns .cancel-btn { background:#f1f5f9; color:#475569; }
.modal-btns .cancel-btn:hover { background:#e2e8f0; }
</style>
</head>
<body>

<script src="auth.js"></script>
<script>
    // Redirect if already logged in (Prevents login page flashing)
    (function(){
        if(typeof hrmsGetSession === "function"){
            const sess = hrmsGetSession();
            if(sess && sess.employeeId){
                const hideStyle = document.createElement('style');
                hideStyle.innerHTML = 'body { display: none !important; }';
                document.head.appendChild(hideStyle);
                if((sess.role || "").toLowerCase() === "admin"){
                    window.location.href = "dashboard.html";
                } else {
                    window.location.href = "index.html";
                }
            }
        }
    })();
</script>

<div class="login-card">
    <div class="brand-icon">🔐</div>
    <div class="login-title">Attendance &amp; HRMS</div>
    <div class="login-sub">Sign in to your account</div>

    <div class="field">
        <label for="employeeId">Employee ID</label>
        <div class="input-wrapper">
            <input type="text" id="employeeId" placeholder="e.g. EMP001" autocomplete="username">
        </div>
    </div>
    
    <div class="field">
        <label for="password">Password</label>
        <div class="input-wrapper">
            <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
            <button type="button" class="toggle-pw" onclick="togglePassword('password', this)" title="Toggle Password">👁️</button>
        </div>
    </div>

    <div class="remember-row">
        <label class="remember-label">
            <input type="checkbox" id="rememberMe"> Remember Me
        </label>
        <a href="#" class="forgot-link" onclick="openForgotModal(); return false;">Forgot Password?</a>
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">Login</button>
    <div class="error-msg" id="errorMsg"></div>
</div>

<!-- Forgot Password Modal -->
<div class="modal-overlay" id="forgotModal">
    <div class="modal-box">
        <h3>🔑 Forgot Password</h3>
        <p class="modal-hint">Apna Employee ID daalo — agar registered email hai to temporary password wahan bhej diya jayega.</p>
        <div class="field">
            <label for="forgotEmployeeId">Employee ID</label>
            <div class="input-wrapper">
                <input type="text" id="forgotEmployeeId" placeholder="e.g. EMP001">
            </div>
        </div>
        <div class="modal-btns">
            <button class="cancel-btn" onclick="closeForgotModal()">Cancel</button>
            <button class="login-btn" id="forgotSendBtn" onclick="submitForgotPassword()">Send</button>
        </div>
        <div class="error-msg" id="forgotMsg"></div>
    </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzba_45MV6qR9dJ3zSS9dH78zJ_b9AqqhjPbzmgHk9XsQrr--raUmehkkiyspnOs6pSBw/exec";

function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁️';
    }
}

function doLogin(){
    const employeeId = document.getElementById('employeeId').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    errorMsg.textContent = "";

    if(!employeeId || !password){
        errorMsg.textContent = "Employee ID aur Password dono bharo.";
        return;
    }

    if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")){
        errorMsg.textContent = "Apps Script URL set nahi hai — login.html ke APPS_SCRIPT_URL ko update karo.";
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', employeeId, password })
    })
    .then(res => res.json())
    .then(json => {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";

        if(json.result !== "success"){
            errorMsg.textContent = json.message || "Login failed";
            return;
        }

        const rememberMe = document.getElementById('rememberMe').checked;
        if(typeof hrmsSetSession === "function"){
            hrmsSetSession(json.profile, rememberMe);
        }

        if((json.profile.role || "").toLowerCase() === "admin"){
            window.location.href = "dashboard.html";
        } else {
            window.location.href = "index.html";
        }
    })
    .catch(err => {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
        errorMsg.textContent = "❌ Login request fail ho gayi — internet/Apps Script check karo.";
        console.error(err);
    });
}

// Enter key submit handling for inputs
document.getElementById('password').addEventListener('keydown', function(e){
    if(e.key === 'Enter') doLogin();
});
document.getElementById('employeeId').addEventListener('keydown', function(e){
    if(e.key === 'Enter') doLogin();
});

function openForgotModal(){
    document.getElementById('forgotEmployeeId').value = "";
    document.getElementById('forgotMsg').textContent = "";
    document.getElementById('forgotModal').classList.add('open');
}

function closeForgotModal(){
    document.getElementById('forgotModal').classList.remove('open');
}

function submitForgotPassword(){
    const employeeId = document.getElementById('forgotEmployeeId').value.trim();
    const forgotMsg = document.getElementById('forgotMsg');
    const sendBtn = document.getElementById('forgotSendBtn');

    forgotMsg.style.color = "#dc2626";
    forgotMsg.textContent = "";

    if(!employeeId){
        forgotMsg.textContent = "Employee ID daalo.";
        return;
    }
    if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")){
        forgotMsg.textContent = "Apps Script URL set nahi hai.";
        return;
    }

    sendBtn.disabled = true;
    sendBtn.textContent = "Sending...";

    fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'forgotPassword', employeeId })
    })
    .then(res => res.json())
    .then(json => {
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
        forgotMsg.style.color = json.result === "success" ? "#16a34a" : "#dc2626";
        forgotMsg.textContent = json.message || (json.result === "success" ? "Sent!" : "Failed");
    })
    .catch(err => {
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
        forgotMsg.style.color = "#dc2626";
        forgotMsg.textContent = "❌ Request fail ho gayi — internet/URL check karo.";
        console.error(err);
    });
}
</script>

</body>
</html>
