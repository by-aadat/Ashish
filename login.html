<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Attendance System</title>

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
html{ height:100%; background:#d7b8ff; }
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #d7b8ff, #d8f8d8, #fff0c4);
    background-size: 200% 200%;
    animation: gradientMove 15s ease infinite;
    padding:20px;
}
@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.login-card{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.3);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.4);
    border-radius:26px;
    padding:40px 34px;
    box-shadow:0 15px 35px rgba(0,0,0,0.12);
}
.login-title{
    text-align:center;
    font-size:2rem;
    font-weight:800;
    color:#13004a;
    margin-bottom:6px;
}
.login-sub{
    text-align:center;
    font-size:13px;
    font-weight:600;
    color:#4a4a63;
    margin-bottom:28px;
}
.field{ margin-bottom:18px; }
.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:#4a4a63;
    margin-bottom:6px;
}
.field input{
    width:100%;
    background: rgba(255,255,255,0.75);
    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 14px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight:600;
    color:#333;
    font-family:inherit;
}
.field input:focus{
    outline:none;
    background:rgba(255,255,255,0.95);
    border-color:#6a1b9a;
}
.login-btn{
    width:100%;
    padding:14px;
    font-size:17px;
    font-weight:800;
    border-radius:16px;
    border:none;
    background:#13004a;
    color:#fff;
    cursor:pointer;
    transition:.25s;
    margin-top:6px;
}
.login-btn:hover{ background:#220373; transform:translateY(-2px); }
.login-btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; }
.error-msg{
    text-align:center;
    color:#b71c1c;
    font-weight:700;
    font-size:13px;
    margin-top:14px;
    min-height:18px;
}
</style>
</head>
<body>

<div class="login-card">
    <div class="login-title">🔐 Login</div>
    <div class="login-sub">Attendance &amp; HRMS System</div>

    <div class="field">
        <label for="employeeId">Employee ID</label>
        <input type="text" id="employeeId" placeholder="e.g. EMP001" autocomplete="username">
    </div>
    <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">Login</button>
    <div class="error-msg" id="errorMsg"></div>
</div>

<script>
// PASTE THE SAME GOOGLE APPS SCRIPT WEB APP URL USED ON THE OTHER PAGES
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby-rySy13a6Rf9GTG-HDwgeSJ6qwNpXGOsEeCyI32xElqyOHzWIclbTRdmgytOHOffjgQ/exec";

function doLogin(){
    const employeeId = document.getElementById('employeeId').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    errorMsg.textContent = "";

    if(!employeeId || !password){
        errorMsg.textContent = "Enter both the Employee ID and the password!";
        return;
    }

    if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")){
        errorMsg.textContent = "Apps Script URL set nahi hai — login.html ke top mein APPS_SCRIPT_URL update karo.";
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', employeeId, password })
    })
    .then(res => res.json())
    .then(json => {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";

        if(json.result !== "success"){
            errorMsg.textContent = json.message || "Login failed";
            return;
        }

        sessionStorage.setItem('hrms_session', JSON.stringify(json.profile));

        if((json.profile.role || "").toLowerCase() === "admin"){
            window.location.href = "dashboard.html";
        } else {
            window.location.href = "index.html";
        }
    })
    .catch(err => {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
        errorMsg.textContent = "❌ Login request fail ho gayi — Apps Script URL/internet check karo.";
        console.error(err);
    });
}

document.getElementById('password').addEventListener('keydown', function(e){
    if(e.key === 'Enter') doLogin();
});
</script>

</body>
</html>
