<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holidays — OmNettwear HRMS</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div id="pageContent">
  <div class="card">
    <div class="card-body">
      <div class="cal-title" id="holHead" style="margin-top:0"><span class="icon-badge"></span>Holiday calendar</div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">
        <button class="btn btn-sm" id="holPrev">&larr;</button>
        <select id="holMonthSel" style="flex:1;max-width:260px;text-align:center"></select>
        <button class="btn btn-sm" id="holNext">&rarr;</button>
      </div>
      <div id="holLegend" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--text-3)"></div>
      <div id="holGrid" class="hol-cal-grid"></div>
      <div id="holDetail" style="margin-top:14px"></div>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
const session = mountShell({ page: 'holidays', title: 'Holidays', sub: 'Company holiday calendar for the year' });
let holidays = [];
let liveSettings = {};

const HOL_MONTHS_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const HOL_MONTHS_HI = ['\u091C\u0928\u0935\u0930\u0940', '\u092B\u093C\u0930\u0935\u0930\u0940', '\u092E\u093E\u0930\u094D\u091A', '\u0905\u092A\u094D\u0930\u0948\u0932', '\u092E\u0908', '\u091C\u0942\u0928', '\u091C\u0941\u0932\u093E\u0908', '\u0905\u0917\u0938\u094D\u0924', '\u0938\u093F\u0924\u0902\u092C\u0930', '\u0905\u0915\u094D\u0924\u0942\u092C\u0930', '\u0928\u0935\u0902\u092C\u0930', '\u0926\u093F\u0938\u0902\u092C\u0930'];
let holCurMonth = new Date().getMonth();
const holYear = 2026;
let holSelectedDate = null;

function holColor(h) {
  return holTypeColor(liveSettings, h.type);
}
function holPad(n) { return n < 10 ? '0' + n : '' + n; }

function holByDate() {
  const map = {};
  holidays.forEach(function (h) {
    if (!map[h.date]) map[h.date] = [];
    map[h.date].push(h);
  });
  return map;
}

function renderHolMonthOptions() {
  el('holMonthSel').innerHTML = HOL_MONTHS_EN.map(function (m, i) {
    return '<option value="' + i + '">' + m + ' ' + HOL_MONTHS_HI[i] + ' ' + holYear + '</option>';
  }).join('');
}

function renderHolCalendar() {
  el('holMonthSel').value = holCurMonth;
  const map = holByDate();
  const grid = el('holGrid');
  grid.innerHTML = '';
  ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].forEach(function (d) {
    const c = document.createElement('div');
    c.textContent = d;
    c.className = 'hol-dow';
    grid.appendChild(c);
  });
  const first = new Date(holYear, holCurMonth, 1);
  const startDow = first.getDay();
  const daysIn = new Date(holYear, holCurMonth + 1, 0).getDate();
  for (let i = 0; i < startDow; i++) grid.appendChild(document.createElement('div'));

  for (let d = 1; d <= daysIn; d++) {
    const key = holPad(d) + '-' + holPad(holCurMonth + 1) + '-' + holYear;
    const hits = map[key];
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'hol-cell' + (hits ? '' : ' hol-cell-empty') + (key === holSelectedDate ? ' hol-cell-active' : '');
    cell.innerHTML = '<span>' + d + '</span>';
    if (hits) {
      const primary = holColor(hits[0]);
      cell.style.background = primary;
      cell.style.borderColor = primary;
      cell.style.color = '#000';
      if (key === holSelectedDate) cell.style.borderWidth = '2px';
      if (hits.length > 1) {
        const dots = document.createElement('span');
        dots.className = 'hol-dots';
        hits.slice(1, 4).forEach(function (h) {
          const dot = document.createElement('span');
          dot.className = 'hol-dot';
          dot.style.background = '#000';
          dot.style.opacity = '0.55';
          dots.appendChild(dot);
        });
        cell.appendChild(dots);
      }
      cell.onclick = function () { holSelectedDate = key; renderHolCalendar(); renderHolDetail(hits); };
    } else {
      cell.disabled = true;
    }
    grid.appendChild(cell);
  }
}

function renderHolLegend() {
  const seen = {};
  holidays.forEach(function (h) { seen[h.type] = true; });
  const types = Object.keys(seen).length ? Object.keys(seen) : Object.keys(HOLTYPE_COLOR_KEYS);
  el('holLegend').innerHTML = types.map(function (t) {
    return '<span><span class="hol-dot" style="background:' + holTypeColor(liveSettings, t) + '"></span>' + esc(t) + '</span>';
  }).join('');
}

function renderHolDetail(hits) {
  const box = el('holDetail');
  if (!hits || !hits.length) { box.innerHTML = ''; return; }
  box.innerHTML = hits.map(function (h, idx) {
    const cardId = 'hd' + idx + '_' + h.holidayId.replace(/[^A-Za-z0-9]/g, '');
    const hasEn = !!(h.descriptionEnglish || '').trim();
    const hasHi = !!(h.descriptionHindi || '').trim();
    const hasImg = !!(h.imageUrl || '').trim();
    return '<div class="hol-detail-card" style="border-left-color:' + holColor(h) + '">' +
      '<div style="font-weight:600;font-size:14.5px;margin-bottom:2px">' + esc(h.occasion) +
      (h.hindiName ? ' \u00B7 ' + esc(h.hindiName) : '') + '</div>' +
      '<div class="sub" style="margin-bottom:' + (hasImg || hasEn || hasHi ? '10px' : '0') + '">' +
      esc(h.type) + (h.paid === 'Yes' ? ' \u00B7 Paid holiday' : ' \u00B7 Working day') + '</div>' +
      (hasImg ? '<img src="' + esc(h.imageUrl) + '" alt="' + esc(h.occasion) +
        '" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-bottom:10px" ' +
        'onerror="this.style.display=\'none\'">' : '') +
      ((hasEn || hasHi) ?
        '<div class="tabs" style="margin-bottom:8px" id="' + cardId + '_tabs">' +
        '<button type="button" class="tab' + (hasEn ? ' active' : '') + '" data-lang="en" data-card="' + cardId + '"' + (hasEn ? '' : ' disabled') + '>English</button>' +
        '<button type="button" class="tab' + (!hasEn && hasHi ? ' active' : '') + '" data-lang="hi" data-card="' + cardId + '"' + (hasHi ? '' : ' disabled') + '>\u0939\u093F\u0902\u0926\u0940</button>' +
        '</div>' +
        '<div id="' + cardId + '_en" style="font-size:13.5px;line-height:1.6;color:var(--text-2)"' + (hasEn ? '' : ' hidden') + '>' + esc(h.descriptionEnglish || '') + '</div>' +
        '<div id="' + cardId + '_hi" style="font-size:13.5px;line-height:1.6;color:var(--text-2)"' + (hasEn && hasHi ? ' hidden' : '') + '>' + esc(h.descriptionHindi || '') + '</div>'
        : '') +
      '</div>';
  }).join('');
  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.onclick = function () {
      const cardId = b.dataset.card;
      document.querySelectorAll('#' + cardId + '_tabs .tab').forEach(function (t) { t.classList.remove('active'); });
      b.classList.add('active');
      el(cardId + '_en').hidden = b.dataset.lang !== 'en';
      el(cardId + '_hi').hidden = b.dataset.lang !== 'hi';
    };
  });
}

el('holPrev').onclick = function () { holCurMonth = (holCurMonth + 11) % 12; holSelectedDate = null; renderHolCalendar(); el('holDetail').innerHTML = ''; };
el('holNext').onclick = function () { holCurMonth = (holCurMonth + 1) % 12; holSelectedDate = null; renderHolCalendar(); el('holDetail').innerHTML = ''; };
el('holMonthSel').onchange = function () { holCurMonth = Number(this.value); holSelectedDate = null; renderHolCalendar(); el('holDetail').innerHTML = ''; };

(async function init() {
  if (!session) return;
  el('holHead').innerHTML = '<span class="icon-badge">' + icon('calendar', 16) + '</span>Holiday calendar';
  try {
    const [hol, set] = await Promise.all([apiGet('holidays'), apiGet('settings')]);
    holidays = hol.holidays;
    liveSettings = set.settings || {};
    renderHolMonthOptions();
    renderHolLegend();
    renderHolCalendar();
  } catch (e) {
    toast(e.message, 'bad');
  }
})();
</script>
</body>
</html>
