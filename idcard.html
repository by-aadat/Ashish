<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID Card — OmNettwear HRMS</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .cards-row { display: flex; gap: 26px; justify-content: center; flex-wrap: wrap; padding: 22px 0 40px; }
  .idcard {
    width: 324px; height: 508px; border-radius: 20px; overflow: hidden; position: relative;
    box-shadow: var(--shadow-lg); border: 1px solid var(--line); background: #fff; font-family: var(--font);
    flex: none;
  }
  .idcard-wave-top { position: absolute; top: 0; left: 0; width: 100%; height: 168px; z-index: 0; }

  /* ---- FRONT ---- */
  .idf-photo {
    position: relative; z-index: 2; width: 112px; height: 112px; margin: 40px auto 0;
    border-radius: 16px; overflow: hidden; border: 4px solid #fff; box-shadow: var(--shadow);
    background: var(--brand);
  }
  .idf-photo img, .idf-photo span {
    width: 100%; height: 100%; object-fit: cover; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 34px; font-family: var(--font-display);
  }
  .idf-body { position: relative; z-index: 2; text-align: center; padding: 14px 24px 0; }
  .idf-body h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 3px; color: var(--navy-900); }
  .idf-body .role { font-size: 12.5px; color: var(--text-2); margin-bottom: 16px; }
  .idf-rows { text-align: left; display: grid; gap: 10px; font-size: 12px; margin-top: 4px; }
  .idf-rows .row { display: flex; align-items: center; gap: 10px; }
  .idf-rows .row .ic {
    width: 26px; height: 26px; border-radius: 8px; background: var(--gold-soft); color: var(--gold);
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .idf-rows .row label { display: block; color: var(--text-3); font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; }
  .idf-rows .row .v { font-family: var(--font-mono); font-weight: 600; font-size: 12.5px; color: var(--navy-900); }
  .idf-barcode { position: absolute; bottom: 14px; left: 0; right: 0; z-index: 2; text-align: center; }
  .idf-barcode svg { height: 34px; }
  .idf-barcode .num { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; color: var(--text-2); margin-top: 2px; }

  /* ---- BACK ---- */
  /* Fixed-height band that always fully contains the wave graphic, so
     the logo/name sit safely on the colour and the body text below never
     starts on top of a still-coloured curve. */
  .idb-top {
    position: relative; z-index: 2; height: 140px; padding: 0 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .idb-logo {
    width: 60px; height: 60px; border-radius: 14px; background: #fff; flex: none;
    display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: var(--shadow);
  }
  .idb-logo img { width: 100%; height: 100%; object-fit: contain; }
  .idb-logo span { color: var(--navy-900); font-weight: 800; font-family: var(--font-display); font-size: 19px; }
  .idb-co-name { color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.25; }
  .idb-co-sub { color: rgba(255,255,255,.75); font-size: 10.5px; margin-top: 3px; }
  .idb-body { position: relative; z-index: 2; padding: 6px 24px 0; }
  .idb-note { font-size: 11.5px; line-height: 1.6; color: var(--text-2); }
  .idb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 16px; font-size: 11px; }
  .idb-grid label { display: block; color: var(--text-3); font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; }
  .idb-grid .v { font-family: var(--font-mono); font-weight: 600; font-size: 12px; color: var(--navy-900); }
  .idb-qr-wrap { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .idb-qr-wrap svg { width: 64px; height: 64px; flex: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px; background: #fff; }
  .idb-qr-text { font-size: 10.5px; color: var(--text-3); line-height: 1.5; }
  .idb-foot {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 2; text-align: center;
    padding: 10px 20px 14px; font-size: 10px; color: var(--text-3);
  }

  @media print {
    body * { visibility: hidden; }
    .cards-row, .cards-row * { visibility: visible; }
    .cards-row { position: absolute; top: 0; left: 0; box-shadow: none; }
    .idcard { box-shadow: none; border: 1px solid #ccc; }
  }
</style>
</head>
<body>

<div id="pageContent">
  <div class="card" style="max-width:460px;margin:0 auto">
    <div class="card-body" style="text-align:center" id="pickerBox">
      <div class="field" id="empPickerField" hidden>
        <label for="empPick">Employee</label>
        <select id="empPick"></select>
      </div>
      <button class="btn btn-primary" id="printBtn" style="margin-top:4px">Print / Save as PDF</button>
    </div>
  </div>

  <div class="cards-row">
    <!-- FRONT -->
    <div class="idcard" id="cardFront">
      <svg class="idcard-wave-top" viewBox="0 0 324 168" preserveAspectRatio="none">
        <defs><linearGradient id="gWaveF" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--navy-900)"/><stop offset="100%" stop-color="var(--navy-700)"/>
        </linearGradient></defs>
        <path fill="url(#gWaveF)" d="M0,0 H324 V90 C 230,135 100,55 0,105 Z"/>
        <path fill="none" stroke="var(--gold)" stroke-width="4" d="M0,105 C 100,55 230,135 324,90"/>
      </svg>
      <div class="idf-photo" id="frontPhoto"></div>
      <div class="idf-body">
        <h2 id="frontName">&nbsp;</h2>
        <div class="role" id="frontRole">&nbsp;</div>
        <div class="idf-rows" id="frontRows"></div>
      </div>
      <div class="idf-barcode">
        <svg id="barcodeSvg" viewBox="0 0 220 34"></svg>
        <div class="num" id="barcodeNum"></div>
      </div>
    </div>

    <!-- BACK -->
    <div class="idcard" id="cardBack">
      <svg class="idcard-wave-top" viewBox="0 0 324 168" preserveAspectRatio="none">
        <defs><linearGradient id="gWaveB" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--navy-900)"/><stop offset="100%" stop-color="var(--navy-700)"/>
        </linearGradient></defs>
        <path fill="url(#gWaveB)" d="M0,0 H324 V95 C 220,125 110,75 0,115 Z"/>
        <path fill="none" stroke="var(--gold)" stroke-width="4" d="M0,115 C 110,75 220,125 324,95"/>
      </svg>
      <div class="idb-top">
        <div class="idb-logo" id="backLogo"><span>OM</span></div>
        <div>
          <div class="idb-co-name" id="backCoName">&nbsp;</div>
          <div class="idb-co-sub" id="backCoSub">&nbsp;</div>
        </div>
      </div>
      <div class="idb-body">
        <div class="idb-note" id="backNote"></div>
        <div class="idb-grid" id="backGrid"></div>
        <div class="idb-qr-wrap">
          <svg id="qrSvg" viewBox="0 0 64 64"></svg>
          <div class="idb-qr-text">Verification code<br>Ask HR to confirm authenticity</div>
        </div>
      </div>
      <div class="idb-foot" id="backFoot"></div>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
const session = mountShell({ page: 'idcard', title: 'ID Card', sub: 'Print or save for the security gate' });
const admin = isAdmin();
const params = new URLSearchParams(location.search);
let targetId = params.get('id') || (session ? session.employeeId : '');

/* ---- decorative barcode + QR, deterministic from the employee ID so it
   looks consistent for that person every time, without any external
   library or scan-ability claim. ---- */
function seededRand(seedStr) {
  let seed = 0;
  for (let i = 0; i < seedStr.length; i++) seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
  return function () {
    seed = (seed * 1103515245 + 12345) >>> 0;
    return (seed >>> 8) / 16777216;
  };
}

function drawBarcode(id) {
  const rand = seededRand(id + '-bar');
  const svg = el('barcodeSvg');
  let x = 0, bars = '';
  while (x < 214) {
    const w = 2 + Math.floor(rand() * 4);
    if (rand() > 0.4) bars += '<rect x="' + x + '" y="0" width="' + w + '" height="34" fill="#1b2a4a"/>';
    x += w + 2;
  }
  svg.innerHTML = bars;
  el('barcodeNum').textContent = id;
}

function drawQr(id) {
  const rand = seededRand(id + '-qr');
  const svg = el('qrSvg');
  const n = 10, cell = 64 / n;
  let sq = '<rect width="64" height="64" fill="#fff"/>';
  /* Three corner "finder" squares, like a real QR, purely for visual
     familiarity \u2014 the rest is a deterministic decorative pattern. */
  function finder(cx, cy) {
    return '<rect x="' + cx + '" y="' + cy + '" width="' + (cell * 3) + '" height="' + (cell * 3) + '" fill="#1b2a4a"/>' +
      '<rect x="' + (cx + cell) + '" y="' + (cy + cell) + '" width="' + cell + '" height="' + cell + '" fill="#fff"/>';
  }
  sq += finder(0, 0) + finder(64 - cell * 3, 0) + finder(0, 64 - cell * 3);
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const inCorner = (r < 3 && c < 3) || (r < 3 && c >= n - 3) || (r >= n - 3 && c < 3);
      if (inCorner) continue;
      if (rand() > 0.52) sq += '<rect x="' + (c * cell) + '" y="' + (r * cell) + '" width="' + cell + '" height="' + cell + '" fill="#1b2a4a"/>';
    }
  }
  svg.innerHTML = sq;
}

function render(e, settings) {
  const co = settings.COMPANY_NAME || 'Company';

  /* ---- front ---- */
  el('frontPhoto').innerHTML = e.photoUrl
    ? '<img src="' + esc(e.photoUrl) + '" alt="">'
    : '<span>' + esc(initials(e.name)) + '</span>';
  el('frontName').textContent = e.name || '\u2014';
  el('frontRole').textContent = (e.designation || e.role || '') + (e.department ? ' \u00B7 ' + e.department : '');

  const rows = [
    ['id', 'Employee ID', e.employeeId],
    ['heart', 'Blood group', e.bloodGroup || '\u2014'],
    ['phone', 'Phone', e.phone || '\u2014'],
    ['mail', 'Email', e.email || '\u2014']
  ];
  el('frontRows').innerHTML = rows.map(function (r) {
    return '<div class="row"><span class="ic">' + icon(r[0] === 'id' ? 'card' : (r[0] === 'heart' ? 'plus' : r[0]), 14) + '</span>' +
      '<div><label>' + esc(r[1]) + '</label><div class="v">' + esc(r[2]) + '</div></div></div>';
  }).join('');
  drawBarcode(e.employeeId || 'EMP000');

  /* ---- back ---- */
  el('backCoName').textContent = co;
  el('backCoSub').textContent = settings.COMPANY_ADDRESS || '';
  el('backLogo').innerHTML = settings.COMPANY_LOGO_URL
    ? '<img src="' + esc(settings.COMPANY_LOGO_URL) + '" alt="">'
    : '<span>' + esc(initials(co)) + '</span>';
  el('backNote').textContent = 'This card is the property of ' + co + ' and must be worn visibly on the premises. If found, please return it to the HR department.';
  el('backGrid').innerHTML =
    '<div><label>Joined</label><div class="v">' + (e.joiningDate ? niceDate(e.joiningDate) : '\u2014') + '</div></div>' +
    '<div><label>Status</label><div class="v">' + esc(e.status || 'Active') + '</div></div>' +
    '<div><label>Emergency contact</label><div class="v">' + esc(e.emergencyContactName || '\u2014') + '</div></div>' +
    '<div><label>Emergency phone</label><div class="v">' + esc(e.emergencyContactPhone || '\u2014') + '</div></div>';
  drawQr(e.employeeId || 'EMP000');
  el('backFoot').textContent = 'Issued ' + todayDMY();

  document.title = (e.name || 'ID Card') + ' \u2014 ID Card';
}

async function load(id) {
  try {
    const [empRes, setRes] = await Promise.all([
      apiGet('employee', { employeeId: id }),
      apiGet('settings')
    ]);
    render(empRes.profile, setRes.settings);
  } catch (e) {
    toast(e.message, 'bad');
  }
}

el('printBtn').onclick = function () { window.print(); };

(async function init() {
  if (!session) return;
  if (admin) {
    try {
      const res = await apiGet('employees');
      const emps = res.employees.filter(function (e) { return e.status !== 'Inactive'; });
      el('empPickerField').hidden = false;
      el('empPick').innerHTML = emps.map(function (e) {
        return '<option value="' + esc(e.employeeId) + '"' + (e.employeeId === targetId ? ' selected' : '') + '>' +
          esc(e.name) + ' \u00B7 ' + esc(e.employeeId) + '</option>';
      }).join('');
      if (!targetId && emps.length) targetId = emps[0].employeeId;
      el('empPick').onchange = function () { targetId = this.value; load(targetId); };
    } catch (e) { toast(e.message, 'bad'); }
  }
  load(targetId);
})();
</script>
</body>
</html>
